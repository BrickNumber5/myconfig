//
// Firefox autoconfig
//

// Set the theme to dark
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("browser.theme.content-theme", 0);
defaultPref("browser.theme.toolbar-theme", 0);

// Open previous windows and tabs
defaultPref("browser.startup.page", 3);

// Change download behavior
var home = getenv("HOME");
defaultPref("browser.download.dir", home + "/downloads");
defaultPref("browser.download.folderList", 2);
defaultPref("browser.download.useDownloadDir", false);

// Disable autosuggestions
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);

// Blank new pages
defaultPref("browser.newtabpage.enabled", false);
defaultPref("browser.startup.homepage", "chrome://browser/content/blanktab.html");

// Disable data reporting
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.usage.uploadEnabled", false);

// Disable searching in the urlbar (without an @option)
// Disable suggestions
defaultPref("keyword.enabled", false);
defaultPref("browser.search.suggest.enabled", false);
defaultPref("browser.urlbar.suggest.bookmark", false);
defaultPref("browser.urlbar.suggest.engines", false);
defaultPref("browser.urlbar.suggest.history", false);
defaultPref("browser.urlbar.suggest.openpage", false);
// These two (for some inexplicable reason)
// refuse to actually set if used as defaultPrefs
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
defaultPref("browser.urlbar.suggest.recentsearches", false);
defaultPref("browser.urlbar.suggest.searches", false);
defaultPref("browser.urlbar.suggest.topsites", false);

// Disable saving passwords (since I use a different password manager)
defaultPref("signon.rememberSignons", false);

// Enable autoscrolling (middle-click + move mouse)
defaultPref("general.autoScroll", true);

// Configure tools
