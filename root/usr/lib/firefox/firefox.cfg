//
// Firefox autoconfig
//

lockPref("_bri_config.global.firefox.cfg.canary", "0100 Syntax Error");

// Set the theme to dark
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("browser.theme.content-theme", 0);
defaultPref("browser.theme.toolbar-theme", 0);

lockPref("_bri_config.global.firefox.cfg.canary", "0200 Syntax Error");

// Open previous windows and tabs
defaultPref("browser.startup.page", 3);

lockPref("_bri_config.global.firefox.cfg.canary", "0300 Syntax Error");

// Change download behavior
var home = getenv("HOME");
defaultPref("browser.download.dir", home + "/downloads");
defaultPref("browser.download.folderList", 2);
defaultPref("browser.download.useDownloadDir", false);

lockPref("_bri_config.global.firefox.cfg.canary", "0400 Syntax Error");

// Disable autosuggestions
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);

lockPref("_bri_config.global.firefox.cfg.canary", "0500 Syntax Error");

// Blank new pages
defaultPref("browser.newtabpage.enabled", false);
defaultPref("browser.startup.homepage", "chrome://browser/content/blanktab.html");

lockPref("_bri_config.global.firefox.cfg.canary", "0600 Syntax Error");

// Disable data reporting
// lockPref because I don't trust firefox to not flip these back to true
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.usage.uploadEnabled", false);

lockPref("_bri_config.global.firefox.cfg.canary", "0650 Syntax Error");

// Disable “““ai””” ““features””
lockPref("browser.ml.enable", false);
lockPref("browser.ml.chat.enabled", false);
lockPref("browser.ml.chat.menu", false);
lockPref("browser.ml.chat.page", false);
lockPref("browser.ml.chat.page.footerBadge", false);
lockPref("browser.ml.chat.page.menuBadge", false);
lockPref("browser.ml.chat.sidebar", false);
lockPref("browser.ml.chat.shortcuts", false);
lockPref("browser.ml.linkPreview.enabled", false);
lockPref("browser.ml.pageAssist.enabled", false);
lockPref("extensions.ml.enabled", false);
lockPref("browser.tabs.groups.smart.enabled", false);
lockPref("browser.tabs.groups.smart.userEnabled", false);
lockPref("browser.search.visualSearch.featureGate", false);

lockPref("_bri_config.global.firefox.cfg.canary", "0700 Syntax Error");

// Disable searching in the urlbar (without an @option)
// Disable suggestions
defaultPref("keyword.enabled", false);
defaultPref("browser.search.suggest.enabled", false);
defaultPref("browser.urlbar.suggest.bookmark", false);
defaultPref("browser.urlbar.suggest.engines", false);
defaultPref("browser.urlbar.suggest.history", false);
defaultPref("browser.urlbar.suggest.openpage", false);
// These two (for some inexplicable reason)
// refuse to actually set if used as defaultPrefs
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
defaultPref("browser.urlbar.suggest.recentsearches", false);
defaultPref("browser.urlbar.suggest.searches", false);
defaultPref("browser.urlbar.suggest.topsites", false);

lockPref("_bri_config.global.firefox.cfg.canary", "0800 Syntax Error");

// Disable saving passwords (since I use a different password manager)
defaultPref("signon.rememberSignons", false);

// Disable saving credit cards and addresses
defaultPref("extensions.formautofill.creditCards.enabled", false);
defaultPref("extensions.formautofill.addresses.enabled", false);

lockPref("_bri_config.global.firefox.cfg.canary", "0900 Syntax Error");

// Enable autoscrolling (middle-click + move mouse)
defaultPref("general.autoScroll", true);

// Make PgUp / PgDn work in ½ page increments
defaultPref("toolkit.scrollbox.pagescroll.maxOverlapLines", 10000);
defaultPref("toolkit.scrollbox.pagescroll.maxOverlapPercent", 50);

// Disable Alt to pull up menu (why would I ever want the menu?)
defaultPref("ui.key.menuAccessKeyFocuses", false);

lockPref("_bri_config.global.firefox.cfg.canary", "1000 Syntax Error");

// Use sans-serif by default
defaultPref("font.default.x-western", "sans-serif");

// Disable autoplay
defaultPref("media.autoplay.default", 5);

lockPref("_bri_config.global.firefox.cfg.canary", "1200 Syntax Error");

// Open devtools in a new window
defaultPref("devtools.toolbox.host", "window");

lockPref("_bri_config.global.firefox.cfg.canary", "1300 Syntax Error");

// Enable user{Chrome,Content}.css
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

lockPref("_bri_config.global.firefox.cfg.canary", "1400 Syntax Error");

// Configure tools
defaultPref("browser.uiCustomization.state", "{\"placements\":{\"widget-overflow-fixed-list\":[],\"unified-extensions-area\":[],\"nav-bar\":[\"back-button\",\"forward-button\",\"stop-reload-button\",\"customizableui-special-spring1\",\"vertical-spacer\",\"urlbar-container\",\"customizableui-special-spring2\",\"open-file-button\",\"downloads-button\",\"unified-extensions-button\"],\"toolbar-menubar\":[\"menubar-items\"],\"TabsToolbar\":[\"tabbrowser-tabs\",\"new-tab-button\",\"alltabs-button\"],\"vertical-tabs\":[],\"PersonalToolbar\":[\"import-button\",\"personal-bookmarks\"]},\"seen\":[\"save-to-pocket-button\",\"developer-button\"],\"dirtyAreaCache\":[\"nav-bar\",\"vertical-tabs\",\"PersonalToolbar\",\"toolbar-menubar\",\"TabsToolbar\",\"widget-overflow-fixed-list\"],\"currentVersion\":21,\"newElementCount\":4}");

lockPref("_bri_config.global.firefox.cfg.canary", "1450 Syntax Error");

// Disable firefox auto-trimming urls
defaultPref("browser.urlbar.trimURLs", false);
defaultPref("browser.urlbar.trimHttps", false);

lockPref("_bri_config.global.firefox.cfg.canary", "[OK] global firefox.cfg fully applied!");

